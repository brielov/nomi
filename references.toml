# Upstream sources and oracle tools (docs/plan.md D3, step 0.6).
#
# Sources are pinned by commit, a content hash, and synced to reference/ by
# `cargo xtask refs`. Binaries are pinned by the SHA-256 of each release
# archive and installed by `cargo xtask oracle fetch`. npm tools are pinned
# by oracles/npm/package-lock.json, which holds the integrity of every
# tarball; only their versions are repeated here, and fetch checks they
# agree. Nothing here is downloaded except by those commands.

