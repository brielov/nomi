[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
nomi-base = { path = "crates/base" }
nomi-syntax = { path = "crates/syntax" }
nomi-testkit = { path = "crates/testkit" }
clap = { version = "4.6", features = ["derive"] }
# Pinned: identifier classes must match the Unicode version of GHC that
# built the reference compilers (15.1).
insta = { version = "1", features = ["glob"] }
icu_properties = { version = "=1.5.1", default-features = false, features = ["compiled_data"] }
proptest = "1"
rowan = "0.16"
stacker = "0.1"
text-size = "1.1"
ungrammar = "1.16"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
