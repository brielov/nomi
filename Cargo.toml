[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
nomi-base = { path = "crates/base" }
nomi-codegen-js = { path = "crates/codegen-js" }
nomi-compiler = { path = "crates/compiler" }
nomi-engine = { path = "crates/engine" }
nomi-format = { path = "crates/format" }
nomi-ide = { path = "crates/ide" }
nomi-lsp = { path = "crates/lsp" }
nomi-project = { path = "crates/project" }
nomi-registry = { path = "crates/registry" }
nomi-syntax = { path = "crates/syntax" }
nomi-test = { path = "crates/test" }
nomi-testkit = { path = "crates/testkit" }
crossbeam-channel = "0.5"
clap = { version = "4.6", features = ["derive"] }
insta = { version = "1", features = ["glob"] }
# Pinned: identifier classes and elm-format's escapes must match the
# Unicode version of GHC that built the reference tools (15.1).
icu_properties = { version = "=1.5.1", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "=1.5.1", default-features = false, features = ["compiled_data"] }
lsp-server = "0.7.8"
# 0.95 names documents by `url::Url`, which converts to and from paths.
lsp-types = "=0.95.1"
num-bigint = "0.5"
proptest = "1"
pubgrub = "0.3"
rayon = "1.12"
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.11"
similar = "2.7"
sha2 = "0.11"
stacker = "0.1"
tempfile = "3.27"
text-size = "1.1"
ungrammar = "1.16"
ureq = { version = "3.4", features = ["gzip", "platform-verifier"] }
walkdir = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# architecture.md §13, where a lint can check it.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
allow_attributes_without_reason = "warn"
# T2, T4
fn_params_excessive_bools = "warn"
option_option = "warn"
struct_excessive_bools = "warn"
# T5
match_wildcard_for_single_variants = "warn"
# F3
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
ref_option = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
# F4
implicit_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
stable_sort_primitive = "warn"
# Plain code
bool_to_int_with_if = "warn"
cast_lossless = "warn"
doc_markdown = "warn"
enum_glob_use = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
if_not_else = "warn"
items_after_statements = "warn"
manual_assert = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_for_each = "warn"
nonminimal_bool = "warn"
range_plus_one = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
unnested_or_patterns = "warn"
useless_let_if_seq = "warn"

# The artifact cache hashes nomi's own executable once per run (CR.6);
# unoptimized, that takes seconds in a development build.
[profile.dev.package.sha2]
opt-level = 3
