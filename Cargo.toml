[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
nomi-base = { path = "crates/base" }
nomi-engine = { path = "crates/engine" }
nomi-format = { path = "crates/format" }
nomi-project = { path = "crates/project" }
nomi-syntax = { path = "crates/syntax" }
nomi-testkit = { path = "crates/testkit" }
clap = { version = "4.6", features = ["derive"] }
insta = { version = "1", features = ["glob"] }
# Pinned: identifier classes and elm-format's escapes must match the
# Unicode version of GHC that built the reference tools (15.1).
icu_properties = { version = "=1.5.1", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "=1.5.1", default-features = false, features = ["compiled_data"] }
num-bigint = "0.5"
proptest = "1"
rayon = "1.12"
rowan = "0.16"
stacker = "0.1"
tempfile = "3.27"
text-size = "1.1"
ungrammar = "1.16"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
