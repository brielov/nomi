# Docspell's API modules are generated from its OpenAPI spec by an sbt
# plugin. This runs once per checkout; the output tree is pinned by the
# hash of its sha256sum-style listing.
[app.prepare]
sbt-task = "webapp/openapiCodegen"
input = "modules/restapi/src/main/resources/docspell-openapi.yml"
input-sha256 = "2ef02f4249531917292622d4bcce771facdcd391b7ff6ba8b8d6708e8631bb1d"
output = "modules/webapp/target/elm-src"
files = 130
output-sha256 = "283005a1af9ccf61034799d9cc05a58fd78fc2efbbf5c1a7db21c5ea1469b27b"
sbt-launcher = { url = "https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/1.11.7/sbt-launch-1.11.7.jar", sha256 = "f92a2095ac75008764fe3b2b793ffe624c4fbef5bfd9b0022e4bc2daf668c651" }

