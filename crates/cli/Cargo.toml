[package]
name = "nomi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nomi"
path = "src/main.rs"

# The tier-2 suites `cargo xtask services` runs against servers in
# containers: tier 1 lints them, with this feature, and runs none.
[[test]]
name = "nomi_services"
required-features = ["services"]

[features]
services = []

[dependencies]
clap.workspace = true
mimalloc.workspace = true
nomi-base.workspace = true
nomi-engine.workspace = true
nomi-lsp.workspace = true
nomi-test.workspace = true

[dev-dependencies]
lsp-server.workspace = true
lsp-types.workspace = true
nomi-project.workspace = true
nomi-registry.workspace = true
nomi-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
